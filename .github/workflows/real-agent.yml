# A real agent, on every platform: OpenCode's free model answers with no
# account and no key, so CI can run a real turn through nuza's harness on
# Linux (inside Landlock), macOS (inside Seatbelt) and Windows (unfenced, as
# the notice there says) without holding any secret.
#
# It depends on a service outside this repository, so it runs when the agent
# code changes, on demand, and once a week - and is not a required check.

name: real agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "src-tauri/src/agent/**"
      - "src-tauri/src/vaultserver*/**"
      - "src-tauri/src/vaultserver.rs"
      - "src-tauri/src/shellpath.rs"
      - ".github/workflows/real-agent.yml"

concurrency:
  group: real-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    name: OpenCode (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The way docs/ai.md offers for anyone GitHub's downloads do not reach.
      - name: install OpenCode
        run: |
          npm install -g opencode-ai@1.19.0
          opencode --version

      # A turn through the harness, and - on macOS and Linux - the agent asked
      # plainly to read a file in home and to write into the vault, home and
      # its session folder, none of which it may.
      - name: a real turn, inside the fence
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture real_opencode_streams_through_the_harness real_opencode_is_fenced_in
        env:
          NUZA_REQUIRE_LANDLOCK: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
